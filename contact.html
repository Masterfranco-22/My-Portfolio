<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Page</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <a href="index2.html" class="logo">Franco Lee</a>
      <nav>
        <ul>
          <li><a href="service.html">Skills</a></li>
          <li><a href="contact.html">Hire Me</a></li>
        </ul>
      </nav>
      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Switch to dark theme"
        aria-pressed="false"
      >
        ☾
      </button>
    </header>
    <section class="auth reveal">
      <form action="" method="POST">
        <h3>Contact Us</h3>
        <div class="wrappar">
          <input type="text" placeholder="E.g John Doe" required />
          <label for="Name">Name:</label>
        </div>
        <div class="wrappar">
          <input type="email" placeholder="E.g john.doe@example.com" required />
          <label for="Email">Email:</label>
        </div>
        <div class="wrappar">
          <textarea
            name="message"
            id="message"
            placeholder="Your message here..."
            required
          ></textarea>
          <label for="textarea" class="message">Message:</label>
        </div>
        <div>
          <button type="submit" onclick="location.href = `/contact.html`">
            Submit
          </button>
        </div>
      </form>
    </section>
    <footer class="site-footer reveal">
      <div class="footer-content">
        <a href="index.html" class="footer-logo">Franco Lee</a>

        <p>
          Frontend and Full-Stack Web Developer building modern digital
          experiences.
        </p>

        <nav class="footer-links" aria-label="Footer navigation">
          <a href="index.html">Home</a>
          <a href="service.html">Skills</a>
          <a href="contact.html">Contact</a>
        </nav>

        <div class="footer-socials">
          <a href="#" aria-label="GitHub">GitHub</a>
          <a href="#" aria-label="LinkedIn">LinkedIn</a>
        </div>
      </div>

      <p class="copyright">&copy; 2026 Franco Lee. All rights reserved.</p>
    </footer>
    <script src="./js/theme-toggle.js" defer></script>
    <script src="./js/scroll-reveal.js" defer></script>
  </body>
</html>
