<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width= , initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Oxygen,
        Ubuntu,
        Cantarell,
        "Open Sans",
        "Helvetica Neue",
        sans-serif;
      background-color: black;
      color: #e7e7e7;
      min-height: 100vh;
      line-height: 1.5;
    }

    .layer-blur {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(10px);
      z-index: -1;
    }
    /* Gradient and layer blur effect */
    .image-gradient {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0.5;
      z-index: -1;
    }
    .layer-blur {
      position: absolute;
      top: 20%;
      right: 0;
      left: 5%;
      width: 30rem;
      height: 0;
      box-shadow: 0 0 700px 25px white;
      rotate: -30deg;
      z-index: -1;
    }
    /* container */
    .container {
      width: 100%;
      margin: 0 auto;
      padding: 0 2rem;
      position: relative;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      z-index: 999;
    }
    header h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 300;
    }
    .hire-me-button {
      background-color: #a7a7a7;
      color: black;
      border: none;
      padding: 0.8rem 2rem;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: background-color 0.2s ease;
      z-index: 999;
    }
    .hire-me-button:hover {
      background-color: white;
    }
    /* MAIN CONTENT*/
    main {
      display: flex;
      flex-direction: column;
      justify-content: center;

      min-height: calc(90vh - 6rem);
    }
    .content {
      max-width: 40rem;
      margin-left: 2%;
      z-index: 999;
    }

    .tag-box {
      position: relative;
      width: 18rem;
      height: 2.5rem;
      border-radius: 50px;
      background: linear-gradient(
        to right,
        #656565,
        #7fa2a7,
        #6600c5,
        #5300a0,
        #757575,
        #656565
      );
      background-size: 200%;
      animation: animationGradient 2.5s linear infinite;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }
    @keyframes animationGradient {
      to {
        background-position: 200%;
      }
    }

    .tag-box .tag {
      position: absolute;
      inset: 3px 3px 3px 3px;
      background-color: black;
      border-radius: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.5s ease;
      cursor: pointer;
    }

    .tag-box .tag:hover {
      color: #5300a0;
    }
    .content h1 {
      font-size: 4rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      margin: 2rem 0;
      line-height: 1.2;
      text-shadow: 0 0 10px rgba(128, 128, 128, 0.418);
    }
    .sub-heading {
      font-size: 1.2rem;
      letter-spacing: 0.5em;
      font-weight: 400;
      color: gray;
      max-width: 35rem;
    }

    .button {
      margin-top: 2rem;
      z-index: 999;
    }
    .btn-get-started {
      text-decoration: none;
      border: 1px solid #2a2a2a;
      padding: 0.7rem 1.2rem;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      transition: tranform 0.2s ease;
    }
    .btn-get-started:hover {
      background-color: #1a1a1a;
      box-shadow: 0 0 0 12px rgba(255, 255, 255, 0.3);
      transform: scale(1.5%);
    }

    .robot-3d {
      position: absolute;
      top: 15%;
      right: 0;
      width: 50%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 0;
    }

    /* .robot-3d {
      width: min(32rem, 85%);
      height: min(42rem, 70vh);
      display: block;
      filter: drop-shadow(0 30px 30px rgba(0, 0, 0, 0.35));
    } */

    /* tablet responsive */
    /* @media (max-width: 1300px) {
      header {
        padding: 1rem 0.5rem;
      }
      .content {
        margin-top: 85%;
      }
      .robot-3d {
        scale: 0.8;
        top: -20%;
        right: 2%;
      }
    } */

    /* mobile responsive */
    @media (max-width: 768px) {
      header {
        padding: 0.6rem 1.5rem;
      }
      header h1 {
        font-size: 1.5rem;
      }
      .hire-me-button {
        padding: 0.6rem 1.2rem;
      }
      main {
        margin-top: -10rem;
      }
      .content {
        margin-top: 25rem;
        max-width: 30rem;
        margin-left: 10%;
      }
      .robot-3d {
        width: 100%;
        top: -10rem;
        right: 0;
        /* height: 40vh; */
      }

      .tag-box {
        width: 12rem;
      }
    }
  </style>
  <body>
    <img class="image-gradient" src="assests/img/gradient.png" alt="gradient" />
    <div class="layer-blur"></div>

    <div class="container">
      <header>
        <h1 data-aos="fade-down" data-aos-duration="1500" class="logo">
          Franco Lee
        </h1>
        <button
          class="hire-me-button"
          data-aos="fade-down"
          data-aos-duration="1500"
          onclick="location.href = `/index.html`"
        >
          Let Build Something Great <i class="fas fa-arrow-right"></i>
        </button>
      </header>
      <main>
        <div class="content">
          <div
            data-aos="fade-zoom-in"
            data-aos-easing="ease-in-back"
            data-aos-delay="300"
            data-aos-offset="0"
            data-aos-duration="1500"
            class="tag-box"
          >
            <div class="tag">Web Developer &wedbar;</div>
          </div>
          <h1
            data-aos="fade-zoom-in"
            data-aos-easing="ease-in-back"
            data-aos-delay="300"
            data-aos-offset="0"
            data-aos-duration="2000"
            class="main-heading"
          >
            Hello, I'm Franco Lee 👋
          </h1>
          <p
            data-aos="fade-zoom-in"
            data-aos-easing="ease-in-back"
            data-aos-delay="300"
            data-aos-offset="0"
            data-aos-duration="2500"
            class="sub-heading"
          >
            I am a web developer with a passion for creating beautiful Website.
          </p>
          <div
            data-aos="fade-zoom-in"
            data-aos-easing="ease-in-back"
            data-aos-delay="300"
            data-aos-offset="0"
            data-aos-duration="3000"
            class="button"
          >
            <a href="index.html" class="btn-get-started">Get Started &gt;</a>
          </div>
        </div>
      </main>

      <spline-viewer
        data-aos="fade-zoom-in"
        data-aos-easing="ease-in-back"
        data-aos-delay="300"
        data-aos-offset="0"
        data-aos-duration="3000"
        class="robot-3d"
        url="https://prod.spline.design/1LivOqvtJASXmCah/scene.splinecode"
        branding="false"
      ></spline-viewer>
    </div>
    <script
      type="module"
      src="https://cdn.spline.design/@splinetool/viewer@2.0.41/build/spline-viewer.js"
    ></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
      AOS.init();
    </script>
  </body>
</html>
